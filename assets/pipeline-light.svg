<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300" role="img" aria-labelledby="t2">
<title id="t2">From problem to production: problem, architecture, AI and data, product, ship and measure.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F8FA"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0969DA"/><stop offset="1" stop-color="#8250DF"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#D0D7DE" stroke-opacity=".45"/></pattern>
  <clipPath id="clip"><rect width="1400" height="300" rx="24"/></clipPath>
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif} .mono{font-family:'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .flow{animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-14}}
    .node{opacity:0;animation:rise .6s ease-out forwards}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .n0{animation-delay:0.00s}.n1{animation-delay:0.18s}.n2{animation-delay:0.36s}.n3{animation-delay:0.54s}.n4{animation-delay:0.72s}
  </style>
</defs>
<g clip-path="url(#clip)"><rect width="1400" height="300" fill="url(#bg)"/><rect width="1400" height="300" fill="url(#grid)"/><rect width="1400" height="4" fill="url(#acc)"/></g>
<rect x=".5" y=".5" width="1399" height="299" rx="24" fill="none" stroke="#D0D7DE"/>
<text x="60" y="56" class="sans" font-size="22" font-weight="800" fill="#1F2328">FROM PROBLEM TO PRODUCTION</text>
<text x="60" y="82" class="sans" font-size="15" fill="#656D76">A systems-first way of building AI products — the model is one component, the product is the system.</text>
<path d="M276 170.0 H326" stroke="#D0D7DE" stroke-width="2"/><path class="flow" d="M276 170.0 H326" stroke="#0969DA" stroke-width="2" stroke-dasharray="6 8"/><path d="M319 165.0 L326 170.0 L319 175.0" fill="none" stroke="#656D76" stroke-width="2"/><path d="M542 170.0 H592" stroke="#D0D7DE" stroke-width="2"/><path class="flow" d="M542 170.0 H592" stroke="#8250DF" stroke-width="2" stroke-dasharray="6 8"/><path d="M585 165.0 L592 170.0 L585 175.0" fill="none" stroke="#656D76" stroke-width="2"/><path d="M808 170.0 H858" stroke="#D0D7DE" stroke-width="2"/><path class="flow" d="M808 170.0 H858" stroke="#0969DA" stroke-width="2" stroke-dasharray="6 8"/><path d="M851 165.0 L858 170.0 L851 175.0" fill="none" stroke="#656D76" stroke-width="2"/><path d="M1074 170.0 H1124" stroke="#D0D7DE" stroke-width="2"/><path class="flow" d="M1074 170.0 H1124" stroke="#8250DF" stroke-width="2" stroke-dasharray="6 8"/><path d="M1117 165.0 L1124 170.0 L1117 175.0" fill="none" stroke="#656D76" stroke-width="2"/>
<g class="node n0">
  <rect x="60" y="118" width="216" height="104" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>
  <path d="M76 118 H260 A16 16 0 0 1 276 134 V122 H60 V134 A16 16 0 0 1 76 118 Z" fill="#0969DA"/>
  <text x="78" y="154" class="mono" font-size="13" font-weight="700" fill="#0969DA">01</text>
  <text x="78" y="181" class="sans" font-size="18" font-weight="800" fill="#1F2328">PROBLEM</text>
  <text x="78" y="205" class="mono" font-size="11.5" fill="#656D76">what actually hurts</text>
</g><g class="node n1">
  <rect x="326" y="118" width="216" height="104" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>
  <path d="M342 118 H526 A16 16 0 0 1 542 134 V122 H326 V134 A16 16 0 0 1 342 118 Z" fill="#8250DF"/>
  <text x="344" y="154" class="mono" font-size="13" font-weight="700" fill="#8250DF">02</text>
  <text x="344" y="181" class="sans" font-size="18" font-weight="800" fill="#1F2328">ARCHITECTURE</text>
  <text x="344" y="205" class="mono" font-size="11.5" fill="#656D76">boundaries · data flow · failures</text>
</g><g class="node n2">
  <rect x="592" y="118" width="216" height="104" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>
  <path d="M608 118 H792 A16 16 0 0 1 808 134 V122 H592 V134 A16 16 0 0 1 608 118 Z" fill="#0969DA"/>
  <text x="610" y="154" class="mono" font-size="13" font-weight="700" fill="#0969DA">03</text>
  <text x="610" y="181" class="sans" font-size="18" font-weight="800" fill="#1F2328">AI + DATA</text>
  <text x="610" y="205" class="mono" font-size="11.5" fill="#656D76">models · retrieval · evaluation</text>
</g><g class="node n3">
  <rect x="858" y="118" width="216" height="104" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>
  <path d="M874 118 H1058 A16 16 0 0 1 1074 134 V122 H858 V134 A16 16 0 0 1 874 118 Z" fill="#8250DF"/>
  <text x="876" y="154" class="mono" font-size="13" font-weight="700" fill="#8250DF">04</text>
  <text x="876" y="181" class="sans" font-size="18" font-weight="800" fill="#1F2328">PRODUCT</text>
  <text x="876" y="205" class="mono" font-size="11.5" fill="#656D76">interface · API · automation</text>
</g><g class="node n4">
  <rect x="1124" y="118" width="216" height="104" rx="16" fill="#FFFFFF" stroke="#D0D7DE"/>
  <path d="M1140 118 H1324 A16 16 0 0 1 1340 134 V122 H1124 V134 A16 16 0 0 1 1140 118 Z" fill="#1A7F37"/>
  <text x="1142" y="154" class="mono" font-size="13" font-weight="700" fill="#1A7F37">05</text>
  <text x="1142" y="181" class="sans" font-size="18" font-weight="800" fill="#1F2328">SHIP + MEASURE</text>
  <text x="1142" y="205" class="mono" font-size="11.5" fill="#656D76">observability · latency · feedback</text>
</g>
<text x="60" y="262" class="mono" font-size="13.5" fill="#656D76">reliability  •  observability  •  latency  •  maintainability  •  does it still solve the original problem?</text>
</svg>
