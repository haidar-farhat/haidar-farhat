<svg xmlns="http://www.w3.org/2000/svg" width="690" height="330" viewBox="0 0 690 330" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0F1E"/><stop offset="1" stop-color="#050810"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<linearGradient id="accv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
<radialGradient id="gc"><stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<radialGradient id="gv"><stop offset="0" stop-color="#A78BFA" stop-opacity=".22"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1C2742" stroke-opacity=".55"/></pattern>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26345A"/></pattern>
<clipPath id="clip"><rect width="690" height="330" rx="22"/></clipPath>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glow2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<style>
.s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
.blink{animation:bl 1.1s steps(2,start) infinite} @keyframes bl{50%{opacity:0}}
.pulse{animation:pu 2.2s ease-in-out infinite} @keyframes pu{0%,100%{opacity:.45}50%{opacity:1}}
.fade{opacity:0;animation:fd .6s ease-out forwards} @keyframes fd{to{opacity:1}}
.rise{opacity:0;animation:rs .6s ease-out both} @keyframes rs{from{opacity:0}to{opacity:1}}
.dash{animation:da 1s linear infinite} @keyframes da{to{stroke-dashoffset:-16}}
.scan{animation:sc 8s linear infinite} @keyframes sc{from{transform:translateY(-40px)}to{transform:translateY(700px)}}
.spin{animation:sp 6s linear infinite;transform-box:fill-box;transform-origin:center} @keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:spr 14s linear infinite;transform-box:fill-box;transform-origin:center} @keyframes spr{to{transform:rotate(-360deg)}}
.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dr 2.2s ease-out forwards} @keyframes dr{to{stroke-dashoffset:0}}
.flt{animation:fl 9s ease-in-out infinite} @keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,18px)}}
.flt2{animation:fl2 12s ease-in-out infinite} @keyframes fl2{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-16px)}}
</style>
<g clip-path="url(#clip)">
<rect width="690" height="330" fill="url(#bg)"/><rect width="690" height="330" fill="url(#grid)"/>
<g class="flt"><circle cx="565.8" cy="66.0" r="181.50000000000003" fill="url(#gc)"/></g><g class="flt2"><circle cx="172.5" cy="313.5" r="165.0" fill="url(#gv)"/></g>
<g class="scan" opacity=".25"><rect width="690" height="3" fill="url(#acc)"/></g>
</g>
<rect x=".5" y=".5" width="689" height="329" rx="22" fill="none" stroke="#26345A"/>


<rect x="0" y="0" width="6" height="330" fill="#A78BFA"/>
<text x="30" y="46" class="s" font-size="24" font-weight="900" fill="#E6EDF3">LocalApply</text>
<text x="189.0" y="46" class="m" font-size="13" fill="#A78BFA">// jobbler</text>
<text x="30" y="76" class="s" font-size="15" font-weight="700" fill="#A78BFA">Autonomous job-application workstation, on your machine</text>
<text x="30" y="118" class="s" font-size="13.5" fill="#B4C0D3">Scores postings against your real CV, writes documents that</text><text x="30" y="137" class="s" font-size="13.5" fill="#B4C0D3">only claim what you can back, then a browser agent fills forms.</text><text x="30" y="156" class="s" font-size="13.5" fill="#B4C0D3">The LLM picks opaque refs, never selectors: prompt injection</text><text x="30" y="175" class="s" font-size="13.5" fill="#B4C0D3">has no vocabulary to hijack. Dry-run default · 600+ tests.</text><g><rect x="30" y="278" width="60" height="23" rx="11.5" fill="#0B1122" stroke="#26345A"/><text x="60.0" y="292" text-anchor="middle" class="m" font-size="11" fill="#A78BFA">Python</text></g><g><rect x="98" y="278" width="88" height="23" rx="11.5" fill="#0B1122" stroke="#26345A"/><text x="142.0" y="292" text-anchor="middle" class="m" font-size="11" fill="#A78BFA">Playwright</text></g><g><rect x="194" y="278" width="60" height="23" rx="11.5" fill="#0B1122" stroke="#26345A"/><text x="224.0" y="292" text-anchor="middle" class="m" font-size="11" fill="#A78BFA">Ollama</text></g><g><rect x="262" y="278" width="108" height="23" rx="11.5" fill="#0B1122" stroke="#26345A"/><text x="316.0" y="292" text-anchor="middle" class="m" font-size="11" fill="#A78BFA">Policy engine</text></g><g><rect x="378" y="278" width="108" height="23" rx="11.5" fill="#0B1122" stroke="#26345A"/><text x="432.0" y="292" text-anchor="middle" class="m" font-size="11" fill="#A78BFA">State machine</text></g>
<g transform="translate(430,96)"><rect x="0" y="0" width="230" height="160" rx="10" fill="#0B1122" stroke="#26345A"/>
<text x="8" y="14" class="m" font-size="9" fill="#7D8AA5">form · opaque refs · policy verdicts</text><rect x="14" y="22" width="150" height="20" rx="4" fill="#050810" stroke="#26345A"/><text x="20" y="36" class="m" font-size="9.5" fill="#7D8AA5">e17 · Email address</text><rect x="20" y="29" width="0" height="6" rx="3" fill="#22D3EE"><animate attributeName="width" values="0;0;120;120" keyTimes="0;0.00;0.15;1" dur="6s" repeatCount="indefinite"/></rect><text x="176" y="36" class="m" font-size="9.5" font-weight="700" fill="#34D399"><set attributeName="opacity" to="0" begin="0s"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.15;0.20;1" dur="6s" repeatCount="indefinite"/>allow</text><rect x="14" y="52" width="150" height="20" rx="4" fill="#050810" stroke="#26345A"/><text x="20" y="66" class="m" font-size="9.5" fill="#7D8AA5">e20 · Résumé (PDF)</text><rect x="20" y="59" width="0" height="6" rx="3" fill="#22D3EE"><animate attributeName="width" values="0;0;120;120" keyTimes="0;0.20;0.35;1" dur="6s" repeatCount="indefinite"/></rect><text x="176" y="66" class="m" font-size="9.5" font-weight="700" fill="#34D399"><set attributeName="opacity" to="0" begin="0s"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.35;0.40;1" dur="6s" repeatCount="indefinite"/>allow</text><rect x="14" y="82" width="150" height="20" rx="4" fill="#050810" stroke="#26345A"/><text x="20" y="96" class="m" font-size="9.5" fill="#7D8AA5">e23 · Why this role?</text><rect x="20" y="89" width="0" height="6" rx="3" fill="#22D3EE"><animate attributeName="width" values="0;0;120;120" keyTimes="0;0.40;0.55;1" dur="6s" repeatCount="indefinite"/></rect><text x="176" y="96" class="m" font-size="9.5" font-weight="700" fill="#FBBF24"><set attributeName="opacity" to="0" begin="0s"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.60;1" dur="6s" repeatCount="indefinite"/>ask</text><rect x="14" y="112" width="150" height="20" rx="4" fill="#050810" stroke="#26345A"/><text x="20" y="126" class="m" font-size="9.5" fill="#7D8AA5">e26 · Work authorisation</text><rect x="20" y="119" width="0" height="6" rx="3" fill="#22D3EE"><animate attributeName="width" values="0;0;120;120" keyTimes="0;0.60;0.75;1" dur="6s" repeatCount="indefinite"/></rect><text x="176" y="126" class="m" font-size="9.5" font-weight="700" fill="#F87171"><set attributeName="opacity" to="0" begin="0s"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.75;0.80;1" dur="6s" repeatCount="indefinite"/>deny</text>
<text x="8" y="154" class="m" font-size="9" fill="#34D399">DRY_RUN=on · nothing submits without you</text></g>
<text x="664" y="312" text-anchor="end" class="m" font-size="10" fill="#7D8AA5">▸ open repository</text>

</svg>