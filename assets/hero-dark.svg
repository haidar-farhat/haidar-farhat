<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
<title id="title">Haidar Farhat — AI Engineer and Full-Stack Software Engineer</title>
<desc id="desc">Local-first AI systems, computer vision, geospatial intelligence, LLM agents and production software.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#0A0F1A"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58A6FF"/><stop offset="1" stop-color="#A371F7"/></linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#58A6FF" stop-opacity=".32"/><stop offset="1" stop-color="#58A6FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#A371F7" stop-opacity=".28"/><stop offset="1" stop-color="#A371F7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#30363D" stroke-opacity=".28" stroke-width="1"/></pattern>
  <clipPath id="clip"><rect width="1400" height="420" rx="28"/></clipPath>
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif}
    .mono{font-family:'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .orb1{animation:f1 10s ease-in-out infinite}
    .orb2{animation:f2 13s ease-in-out infinite}
    @keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(-40px,26px)}}
    @keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(34px,-22px)}}
    .line{opacity:0;animation:show .05s linear forwards}
    @keyframes show{to{opacity:1}}
    .l0{animation-delay:0.50s}.l1{animation-delay:1.05s}.l2{animation-delay:1.60s}.l3{animation-delay:2.15s}.l4{animation-delay:2.70s}.l5{animation-delay:3.25s}.l6{animation-delay:3.80s}
    .cursor{animation:show .05s linear forwards,blink 1s steps(2,start) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    .scan{animation:scan 7s linear infinite}
    @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(480px)}}
  </style>
</defs>
<g clip-path="url(#clip)">
  <rect width="1400" height="420" fill="url(#bg)"/>
  <rect width="1400" height="420" fill="url(#grid)"/>
  <g class="orb1"><circle cx="1180" cy="60" r="230" fill="url(#g1)"/></g>
  <g class="orb2"><circle cx="760" cy="420" r="210" fill="url(#g2)"/></g>
  <g class="scan" opacity=".35"><rect x="0" y="0" width="1400" height="2" fill="url(#acc)"/></g>
  <rect x="0" y="0" width="1400" height="4" fill="url(#acc)"/>
</g>
<rect x=".5" y=".5" width="1399" height="419" rx="28" fill="none" stroke="#30363D"/>

<text x="86" y="112" class="mono" font-size="14" fill="#58A6FF">// haidar-farhat</text>
<text x="84" y="182" class="sans" font-size="58" font-weight="800" fill="#F0F6FC" letter-spacing="-1">AI ENGINEER</text>
<text x="84" y="232" class="sans" font-size="27" font-weight="700" fill="url(#acc)">&amp; FULL-STACK SOFTWARE ENGINEER</text>
<text x="86" y="278" class="sans" font-size="17.5" fill="#C9D1D9">Local-first AI systems  ·  Computer vision  ·  Geospatial AI  ·  LLM agents  ·  Production software</text>
<text x="86" y="306" class="mono" font-size="14" fill="#8B949E">build the whole system — not just the demo</text>
<g><rect x="84" y="336" width="75" height="30" rx="15" fill="#1F2633" stroke="#30363D"/><text x="121.5" y="356" text-anchor="middle" class="mono" font-size="13" fill="#C9D1D9">Python</text></g><g><rect x="169" y="336" width="58" height="30" rx="15" fill="#1F2633" stroke="#30363D"/><text x="198.0" y="356" text-anchor="middle" class="mono" font-size="13" fill="#C9D1D9">Rust</text></g><g><rect x="237" y="336" width="108" height="30" rx="15" fill="#1F2633" stroke="#30363D"/><text x="291.0" y="356" text-anchor="middle" class="mono" font-size="13" fill="#C9D1D9">TypeScript</text></g><g><rect x="355" y="336" width="140" height="30" rx="15" fill="#1F2633" stroke="#30363D"/><text x="425.0" y="356" text-anchor="middle" class="mono" font-size="13" fill="#C9D1D9">PyTorch · ONNX</text></g><g><rect x="505" y="336" width="157" height="30" rx="15" fill="#1F2633" stroke="#30363D"/><text x="583.5" y="356" text-anchor="middle" class="mono" font-size="13" fill="#C9D1D9">Laravel · Django</text></g><g><rect x="672" y="336" width="149" height="30" rx="15" fill="#1F2633" stroke="#30363D"/><text x="746.5" y="356" text-anchor="middle" class="mono" font-size="13" fill="#C9D1D9">React · Angular</text></g>

<g>
  <rect x="890" y="78" width="440" height="270" rx="16" fill="#161B22" stroke="#30363D"/>
  <path d="M906 78 H1314 A16 16 0 0 1 1330 94 V116 H890 V94 A16 16 0 0 1 906 78 Z" fill="#1F2633"/>
  <line x1="890" y1="116.5" x2="1330" y2="116.5" stroke="#30363D"/>
  <circle cx="912" cy="97" r="5.5" fill="#F85149"/><circle cx="930" cy="97" r="5.5" fill="#D29922"/><circle cx="948" cy="97" r="5.5" fill="#3FB950"/>
  <text x="1110" y="102" text-anchor="middle" class="mono" font-size="12.5" fill="#8B949E">haidar@lab: ~/builds</text>
  <circle cx="1310" cy="97" r="4" fill="#3FB950" class="pulse"/>
  <text x="916" y="140" class="mono line l0" font-size="13.5" fill="#3FB950">$</text><text x="932" y="140" class="mono line l0" font-size="13.5" fill="#F0F6FC">whoami</text><text x="916" y="166" class="mono line l1" font-size="13.5" fill="#C9D1D9">ai-engineer · full-stack · systems</text><text x="916" y="192" class="mono line l2" font-size="13.5" fill="#3FB950">$</text><text x="932" y="192" class="mono line l2" font-size="13.5" fill="#F0F6FC">ls ./builds</text><text x="916" y="218" class="mono line l3" font-size="13.5" fill="#58A6FF">vigil/  localapply/  brevet-gpt/  nu-scaler/</text><text x="916" y="244" class="mono line l4" font-size="13.5" fill="#3FB950">$</text><text x="932" y="244" class="mono line l4" font-size="13.5" fill="#F0F6FC">cat principles.txt</text><text x="916" y="270" class="mono line l5" font-size="13.5" fill="#C9D1D9">local-first · evidence-carrying · human-in-loop</text><text x="916" y="296" class="mono line l6" font-size="13.5" fill="#3FB950">$</text><text x="932" y="296" class="mono line l6" font-size="13.5" fill="#F0F6FC">./ship --to production</text><rect x="1116" y="283" width="8" height="17" fill="#58A6FF" class="line l6 cursor"/>
</g>
</svg>
