<style>
.s{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Helvetica,Arial,sans-serif} .m{font-family:'Cascadia Code','JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
.blink{animation:bl 1.1s steps(2,start) infinite} @keyframes bl{50%{opacity:0}}
.pulse{animation:pu 2.2s ease-in-out infinite} @keyframes pu{0%,100%{opacity:.45}50%{opacity:1}}
.fade{opacity:0;animation:fd .6s ease-out forwards} @keyframes fd{to{opacity:1}}
.rise{opacity:0;animation:rs .6s ease-out both} @keyframes rs{from{opacity:0}to{opacity:1}}
.dash{animation:da 1s linear infinite} @keyframes da{to{stroke-dashoffset:-16}}
.scan{animation:sc 8s linear infinite} @keyframes sc{from{transform:translateY(-40px)}to{transform:translateY(700px)}}
.spin{animation:sp 6s linear infinite;transform-box:fill-box;transform-origin:center} @keyframes sp{to{transform:rotate(360deg)}}
.spinr{animation:spr 14s linear infinite;transform-box:fill-box;transform-origin:center} @keyframes spr{to{transform:rotate(-360deg)}}
.draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:dr 2.2s ease-out forwards} @keyframes dr{to{stroke-dashoffset:0}}
.flt{animation:fl 9s ease-in-out infinite} @keyframes fl{0%,100%{transform:translate(0,0)}50%{transform:translate(-26px,18px)}}
.flt2{animation:fl2 12s ease-in-out infinite} @keyframes fl2{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-16px)}}
.yl{opacity:0;animation:fd .2s linear forwards}.poly{fill-opacity:0;animation:pf 1.2s ease-out forwards 1.2s}@keyframes pf{to{fill-opacity:.22}}</style>
